{% extends "base.html" %}
{% block title %}Nueva invitación{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="h3">Nueva invitación</h1>
    <p class="text-body-secondary mb-0">El paciente verá solo los huecos libres de tu horario laboral.</p>
  </div>
</div>
<form method="post" class="card card-body">
  {% csrf_token %}
  {% include "partials/form_fields.html" %}
  <div class="d-flex gap-2">
    <button class="btn btn-primary">Crear enlace</button>
    <a class="btn btn-outline-secondary" href="{% url 'booking:invitation_list' %}">Cancelar</a>
  </div>
</form>
{% endblock %}
